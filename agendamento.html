<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Maique Barber</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    
    <link rel="stylesheet" href="src/css/agendamento.css">
    <link rel="icon" type="image/png" href="src/imgs/logoIcon.png">
</head>
<body>

    <header class="header-agendamento">
        <a href="index.html" class="btn-voltar" title="Voltar para a Home">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <img src="src/imgs/logo preta.png" alt="Maique Barber Logo" class="logo-min">
    </header>

    <main class="container-agenda">
        <div class="cabecalho-agenda">
            <h2><i class="fa-solid fa-calendar-check"></i> Escolha seu Horário</h2>
            <p>Selecione a data para ver a disponibilidade atual.</p>
            
            <div class="seletor-data">
                <label for="input-data"><i class="fa-regular fa-calendar"></i> Data do Agendamento:</label>
                <input type="text" id="input-data" placeholder="Selecione a data..." required>
            </div>
        </div>

        <div id="grid-horarios" class="grid-horarios">
            </div>
    </main>

    <div id="modal-reserva" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="btn-fechar-modal" id="btn-fechar-modal"><i class="fa-solid fa-xmark"></i></button>
            
            <h3>Confirmar Horário</h3>
            <p class="horario-destaque" id="texto-horario-selecionado">10:00</p>
            
            <form id="form-reserva">
                <div class="form-group">
                    <label for="nome-cliente">Seu Nome e Sobrenome</label>
                    <input type="text" id="nome-cliente" placeholder="Ex: Lucas Silva" required autocomplete="name">
                </div>
                
                <div class="form-group">
                    <label for="servico-escolhido">Serviço Principal</label>
                    <select id="servico-escolhido" required>
                        <option value="" disabled selected>O que vamos fazer hoje?</option>
                        <option value="Corte">Só Corte</option>
                        <option value="Barba">Só Barba</option>
                        <option value="Corte + Barba">Corte + Barba (Combo)</option>
                        <option value="Química">Luzes / Platinado</option>
                    </select>
                </div>

                <button type="submit" class="btn-confirmar">Agendar Horário</button>
            </form>
        </div>
    </div>

    <div id="modal-sucesso" class="modal-overlay hidden">
        <div class="modal-content text-center">
            <i class="fa-solid fa-circle-check icone-sucesso"></i>
            <h3>Tudo Certo!</h3>
            <div id="texto-sucesso" class="texto-sucesso">
                </div>
            <button class="btn-confirmar" id="btn-fechar-sucesso">Entendi</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script> <script src="src/js/agendamento.js"></script>
</body>
</html>
